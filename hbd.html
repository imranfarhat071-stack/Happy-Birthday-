<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Hide the video element as we only need it to feed the camera to the AI */
        video {
            display: none; 
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.7);
            font-family: sans-serif;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="loading">Requesting camera access & loading AI...</div>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('video');
        const loadingText = document.getElementById('loading');

        // Set canvas to full screen
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Particle System ---
        class Particle {
            constructor() {
                this.originX = Math.random() * canvas.width;
                this.originY = Math.random() * canvas.height;
                this.x = this.originX;
                this.y = this.originY;
                this.vx = 0;
                this.vy = 0;
                this.size = Math.random() * 2 + 0.5; // Non-uniform small sizes
                this.friction = 0.85; // How fast they slow down
                this.spring = 0.05; // Elasticity to return to original position
            }

            update(targetX, targetY) {
                let dx = this.x - targetX;
                let dy = this.y - targetY;
                let distance = Math.sqrt(dx * dx + dy * dy);

                // If hand is close, push particles away
                let interactionRadius = 120;
                if (distance < interactionRadius) {
                    let force = (interactionRadius - distance) / interactionRadius;
                    this.vx += (dx / distance) * force * 10;
                    this.vy += (dy / distance) * force * 10;
                }

                // Elastic spring force pulling back to origin
                this.vx += (this.originX - this.x) * this.spring;
                this.vy += (this.originY - this.y) * this.spring;

                // Apply friction
                this.vx *= this.friction;
                this.vy *= this.friction;

                // Update position
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Generate dust particles
        let particles = [];
        for (let i = 0; i < 600; i++) {
            particles.push(new Particle());
        }

        let handX = -1000;
        let handY = -1000;

        // --- Hand Tracking System ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6,
            selfieMode: true // Mirrors the tracking so it feels natural
        });

        hands.onResults((results) => {
            // Hide loading text once tracking starts
            loadingText.style.opacity = 0;

            // Clear the screen with a slight trail effect (alpha 0.3) or fully (alpha 1)
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Get hand coordinates (using the index finger tip: landmark 8)
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const indexFinger = results.multiHandLandmarks[0][8];
                // Convert normalized coordinates (0 to 1) to canvas pixels
                handX = indexFinger.x * canvas.width;
                handY = indexFinger.y * canvas.height;
            } else {
                // Move target off-screen if no hand is detected
                handX = -1000;
                handY = -1000;
            }

            // Update and draw all particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(handX, handY);
                particles[i].draw();
            }
        });

        // Start the camera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: window.innerWidth,
            height: window.innerHeight,
            facingMode: 'user' // Forces the front-facing (selfie) camera
        });
        camera.start();
    </script>
</body>
</html>
