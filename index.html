<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            z-index: 1;
        }
        video {
            display: none; 
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.7);
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        #presentation-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none; 
            transition: opacity 0.5s ease-in-out;
        }
        
        #slide-image {
            /* FIXED DISTORTION: Enforces screen boundaries while keeping the exact aspect ratio */
            width: 100%;
            height: 100%;
            object-fit: contain; 
            padding: 20px;
            box-sizing: border-box;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }
        
        .slide-up { transform: translateY(-100vh); opacity: 0; }
        .slide-left { transform: translateX(-50vw); opacity: 0; }
        .slide-right { transform: translateX(50vw); opacity: 0; }
        .slide-center { transform: translate(0, 0); opacity: 1; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="loading">Loading AI & Magic Dust...</div>
    <video id="video" autoplay playsinline></video>
    
    <canvas id="canvas"></canvas>

    <div id="presentation-container">
        <img id="slide-image" class="slide-center" src="slide1.jpg" alt="Presentation Slide">
    </div>

    <script>
        // Preload images silently
        const totalSlides = 8;
        for (let i = 1; i <= totalSlides; i++) {
            let img = new Image();
            img.src = `slide${i}.jpg`;
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('video');
        const loadingText = document.getElementById('loading');
        
        const presContainer = document.getElementById('presentation-container');
        const slideImage = document.getElementById('slide-image');
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            offCanvas.width = Math.floor(canvas.width / 4);
            offCanvas.height = Math.floor(canvas.height / 4);
        }
        window.addEventListener('resize', resize);
        resize();

        let presentationMode = false;
        let currentSlide = 1;
        let gestureCooldown = 0; 
        let handHistory = []; 

        function showSlide(slideNum, transitionClass) {
            slideImage.className = transitionClass; 
            setTimeout(() => {
                // Safely assign the next slide
                slideImage.src = `slide${slideNum}.jpg`;
                setTimeout(() => {
                    slideImage.className = 'slide-center';
                }, 50); 
            }, 300); 
        }

        // --- Particle System ---
        let currentShape = 'dust';
        class Particle {
            constructor() {
                this.originX = Math.random() * canvas.width;
                this.originY = Math.random() * canvas.height;
                this.x = this.originX;
                this.y = this.originY;
                this.targetX = this.originX;
                this.targetY = this.originY;
                this.color = 'rgba(255, 255, 255, 0.6)';
                this.vx = 0;
                this.vy = 0;
                this.size = Math.random() * 1.5 + 0.5;
                this.friction = 0.85; 
                this.spring = 0.05 + (Math.random() * 0.05); 
            }
            update(handX, handY) {
                this.vx += (this.targetX - this.x) * this.spring;
                this.vy += (this.targetY - this.y) * this.spring;
                if (currentShape === 'dust' && !presentationMode) {
                    let dx = this.x - handX;
                    let dy = this.y - handY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        let force = (100 - dist) / 100;
                        this.vx += (dx / dist) * force * 15;
                        this.vy += (dy / dist) * force * 15;
                    }
                }
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx;
                this.y += this.vy;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        let particles = [];
        for (let i = 0; i < 3000; i++) { particles.push(new Particle()); }

        function updateParticleTargets(shape) {
            if (shape === currentShape || presentationMode) return; 
            currentShape = shape;

            if (shape === 'dust') {
                particles.forEach(p => { p.targetX = p.originX; p.targetY = p.originY; p.color = 'rgba(255, 255, 255, 0.6)'; });
                return;
            }

            offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
            let cx = offCanvas.width / 2; let cy = offCanvas.height / 2;

            if (shape === 'square') { offCtx.fillStyle = '#FFFFFF'; offCtx.fillRect(cx - 50, cy - 50, 100, 100); } 
            else if (shape === 'circle') { offCtx.fillStyle = '#FFFFFF'; offCtx.beginPath(); offCtx.arc(cx, cy, 50, 0, Math.PI * 2); offCtx.fill(); } 
            else if (shape === 'text') { offCtx.fillStyle = '#FFFFFF'; offCtx.textAlign = 'center'; offCtx.textBaseline = 'middle'; offCtx.font = 'bold ' + (offCanvas.width * 0.12) + 'px sans-serif'; offCtx.fillText('Happy Birthday', cx, cy - 28); offCtx.fillText('Laxmi', cx, cy + 28); } 
            else if (shape === 'flag') { let fw = 100; let fh = 60; let stripeH = fh / 3; offCtx.fillStyle = '#FF9933'; offCtx.fillRect(cx - fw/2, cy - fh/2, fw, stripeH); offCtx.fillStyle = '#FFFFFF'; offCtx.fillRect(cx - fw/2, cy - fh/2 + stripeH, fw, stripeH); offCtx.fillStyle = '#138808'; offCtx.fillRect(cx - fw/2, cy - fh/2 + stripeH*2, fw, stripeH); offCtx.fillStyle = '#000080'; offCtx.beginPath(); offCtx.arc(cx, cy, stripeH * 0.4, 0, Math.PI * 2); offCtx.fill(); }

            let imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height).data;
            let validPixels = [];
            for (let i = 0; i < imgData.length; i += 4) {
                if (imgData[i+3] > 100) { 
                    let pIdx = i / 4;
                    validPixels.push({x: (pIdx % offCanvas.width) * 4, y: Math.floor(pIdx / offCanvas.width) * 4, color: `rgba(${imgData[i]}, ${imgData[i+1]}, ${imgData[i+2]}, 0.9)`});
                }
            }

            if (validPixels.length > 0) {
                validPixels.sort(() => Math.random() - 0.5); 
                particles.forEach((p, index) => { let px = validPixels[index % validPixels.length]; p.targetX = px.x; p.targetY = px.y; p.color = px.color; });
            }
        }

        // --- Gesture Math Logic ---
        function isHandClosed(landmarks) {
            const wrist = landmarks[0];
            const isFolded = (tipIdx, jointIdx) => Math.hypot(landmarks[tipIdx].x - wrist.x, landmarks[tipIdx].y - wrist.y) < Math.hypot(landmarks[jointIdx].x - wrist.x, landmarks[jointIdx].y - wrist.y);
            return isFolded(8,6) && isFolded(12,10) && isFolded(16,14) && isFolded(20,18);
        }

        function isSalute(landmarks) {
            if (isHandClosed(landmarks)) return false;
            return Math.abs(landmarks[12].x - landmarks[0].x) > Math.abs(landmarks[12].y - landmarks[0].y); 
        }

        // --- Swiping Engine ---
        function detectSwipe(landmarks) {
            let now = Date.now();
            if (now - gestureCooldown < 800) return; 

            let wrist = landmarks[0]; 
            handHistory.push({ x: wrist.x, y: wrist.y, time: now });
            handHistory = handHistory.filter(h => now - h.time < 400);

            if (handHistory.length > 3) {
                let startPos = handHistory[0];
                let currentPos = handHistory[handHistory.length - 1];
                let dx = currentPos.x - startPos.x;
                let dy = currentPos.y - startPos.y;

                if (currentSlide === 1) {
                    // Upward swipe to open envelope
                    if (dy < -0.15) { 
                        currentSlide++;
                        showSlide(currentSlide, 'slide-up');
                        gestureCooldown = now;
                        handHistory = [];
                    }
                } else if (currentSlide > 1) {
                    // FIXED: Left and Right swiping
                    if (dx < -0.2 && currentSlide < totalSlides) { 
                        // Swipe Left -> Next Slide
                        currentSlide++;
                        showSlide(currentSlide, 'slide-left');
                        gestureCooldown = now;
                        handHistory = [];
                    } else if (dx > 0.2 && currentSlide > 2) {
                        // Swipe Right -> Previous Slide (stops at slide 2)
                        currentSlide--;
                        showSlide(currentSlide, 'slide-right');
                        gestureCooldown = now;
                        handHistory = [];
                    }
                }
            }
        }

        let handX = -1000;
        let handY = -1000;

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6, selfieMode: true });

        hands.onResults((results) => {
            loadingText.style.opacity = 0;
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let now = Date.now();
            let leftClosed = false, rightClosed = false, saluting = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handX = results.multiHandLandmarks[0][8].x * canvas.width;
                handY = results.multiHandLandmarks[0][8].y * canvas.height;

                // STRICT NAMASTE DETECTION
                if (!presentationMode && results.multiHandLandmarks.length === 2) {
                    let wristDist = Math.hypot(results.multiHandLandmarks[0][0].x - results.multiHandLandmarks[1][0].x, results.multiHandLandmarks[0][0].y - results.multiHandLandmarks[1][0].y);
                    let indexDist = Math.hypot(results.multiHandLandmarks[0][8].x - results.multiHandLandmarks[1][8].x, results.multiHandLandmarks[0][8].y - results.multiHandLandmarks[1][8].y);
                    
                    // Both wrists AND index fingers must be close to trigger
                    if (wristDist < 0.1 && indexDist < 0.1) {
                        presentationMode = true;
                        presContainer.style.opacity = 1;
                        gestureCooldown = now + 1000; // Pause for a second before allowing swipes
                        handHistory = [];
                    }
                }

                if (presentationMode) {
                    detectSwipe(results.multiHandLandmarks[0]);
                }

                if (!presentationMode) {
                    for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                        let landmarks = results.multiHandLandmarks[i];
                        let closed = isHandClosed(landmarks);
                        if (landmarks[0].x > 0.5) {
                            if (closed) rightClosed = true;
                            if (!closed && isSalute(landmarks)) saluting = true;
                        } else {
                            if (closed) leftClosed = true;
                            if (!closed && isSalute(landmarks)) saluting = true; 
                        }
                    }
                }
            } else {
                handX = -1000; handY = -1000;
                handHistory = []; 
            }

            if (!presentationMode) {
                let newShape = 'dust';
                if (leftClosed && rightClosed) newShape = 'text';
                else if (saluting) newShape = 'flag';
                else if (rightClosed) newShape = 'square';
                else if (leftClosed) newShape = 'circle';
                updateParticleTargets(newShape);
            }

            for (let i = 0; i < particles.length; i++) { particles[i].update(handX, handY); particles[i].draw(); }
        });

        const camera = new Camera(videoElement, { onFrame: async () => await hands.send({image: videoElement}), width: window.innerWidth, height: window.innerHeight, facingMode: 'user' });
        camera.start();
    </script>
</body>
</html>
